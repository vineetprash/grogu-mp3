<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grogu MP3</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#d7ef9b">

<style>
:root {
  --paper: #f3efdf;
  --card: #fffdf4;
  --ink: #171916;
  --green: #b8e85a;
  --green-dark: #40582b;
  --pink: #ed3f91;
  --orange: #f27b32;
  --blue: #65a5c5;
  --line: #171916;
  --danger: #c43b2e;
  font-family: Inter, "Avenir Next", "Segoe UI", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle, #171916 1.3px, transparent 1.5px);
  background-size: 18px 18px;
  background-color: var(--paper);
  color: var(--ink);
}

main {
  position: relative;
  width: min(480px, 100%);
  padding: 30px;
  background: var(--card);
  border: 3px solid var(--line);
  box-shadow:
    8px 8px 0 var(--pink),
    14px 14px 0 var(--line);
  overflow: hidden;
}

/* collage */

.art {
  position: absolute;
  width: 105px;
  height: 105px;
  overflow: hidden;
  border: 3px solid var(--line);
  background: #fff;
  box-shadow: 5px 5px 0 var(--line);
  z-index: 0;
}

.art img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.art-one {
  top: -24px;
  right: -20px;
  transform: rotate(7deg);
}

.art-two {
  top: 92px;
  left: -38px;
  transform: rotate(-8deg);
}

header {
  position: relative;
  z-index: 2;
  min-height: 150px;
  margin-bottom: 20px;
  padding-left: 20px;
}

header::before {
  content: "音";
  position: absolute;
  right: 105px;
  top: 3px;
  color: var(--pink);
  font-family: serif;
  font-size: 3rem;
  font-weight: 900;
  transform: rotate(-8deg);
}

header::after {
  content: "★";
  position: absolute;
  right: 25px;
  bottom: 5px;
  color: var(--orange);
  font-size: 2rem;
  transform: rotate(12deg);
}

.title {
  position: relative;
  z-index: 3;
  padding-top: 40px;
}

h1 {
  display: inline-block;
  margin: 0;
  padding: 5px 9px;
  background: var(--green);
  border: 3px solid var(--line);
  font-family: "Arial Black", Impact, sans-serif;
  font-size: clamp(2rem, 9vw, 3rem);
  line-height: .82;
  letter-spacing: -.07em;
  text-transform: uppercase;
  transform: rotate(-2deg);
  box-shadow: 5px 5px 0 var(--line);
}

.sub {
  margin: 16px 0 0 5px;
  font-size: .7rem;
  font-weight: 900;
  letter-spacing: .13em;
  color: var(--green-dark);
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: .72rem;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
}

input {
  width: 100%;
  height: 50px;
  padding: 0 14px;
  border: 3px solid var(--line);
  background: #fff;
  color: var(--ink);
  font: 600 .95rem system-ui, sans-serif;
  outline: none;
  box-shadow: 5px 5px 0 var(--blue);
}

input::placeholder {
  color: #888b82;
}

input:focus {
  border-color: var(--pink);
  box-shadow: 5px 5px 0 var(--pink);
}

button,
.download {
  width: 100%;
  height: 50px;
  margin-top: 15px;
  border: 3px solid var(--line);
  font: 900 .85rem system-ui, sans-serif;
  letter-spacing: .04em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  display: grid;
  place-items: center;
}

#go {
  background: var(--green);
  color: var(--ink);
  box-shadow: 5px 5px 0 var(--line);
}

#go:active {
  transform: translate(5px, 5px);
  box-shadow: none;
}

#go:disabled {
  opacity: .55;
  cursor: wait;
}

#status {
  min-height: 20px;
  margin: 13px 0 0;
  font-size: .8rem;
  font-weight: 700;
  color: var(--green-dark);
}

#status.err {
  color: var(--danger);
}

#result {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 3px dashed var(--line);
}

#filename {
  display: block;
  margin-bottom: 11px;
  padding: 8px 10px;
  border: 2px solid var(--line);
  background: var(--green);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .78rem;
  font-weight: 800;
}

audio {
  width: 100%;
  height: 42px;
}

.download {
  background: var(--pink);
  color: white;
  box-shadow: 5px 5px 0 var(--line);
}

.download:active {
  transform: translate(5px, 5px);
  box-shadow: none;
}

#install {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 4px 4px 0 var(--blue);
}

[hidden] {
  display: none !important;
}

@media (max-width: 520px) {
  body {
    padding: 18px;
  }

  main {
    padding: 25px;
  }

  .art {
    width: 85px;
    height: 85px;
  }

  .art-two {
    top: 105px;
    left: -32px;
  }

  header::before {
    right: 85px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto;
  }
}
</style>
</head>

<body>

<main id="app">

  <div class="art art-one">
    <img src="/p2.jpeg" alt="">
  </div>

  <div class="art art-two">
    <img src="/p1.jpeg" alt="">
  </div>

  <header>
    <div class="title">
      <h1>Grogu<br>MP3</h1>
      <p class="sub">LOCAL AUDIO DECK</p>
    </div>
  </header>

  <label for="url">YouTube link</label>

  <input
    id="url"
    type="url"
    inputmode="url"
    placeholder="Paste a link"
    autocomplete="off"
  >

  <button id="go">Convert</button>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <span id="filename"></span>

    <audio
      id="preview"
      controls
      preload="metadata"
    ></audio>

    <a id="download" class="download">Download MP3</a>
  </section>

  <button id="install" hidden>Install app</button>

</main>

<script src="/app.js"></script>

</body>
</html>
