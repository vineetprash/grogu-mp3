<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grogu MP3</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1b2a2f">
<style>
:root{--bg:#1b2a2f;--panel:#f2e8d5;--ink:#1b2a2f;--mute:#6b6556;--line:#c9bfa8;--go:#2f7d6d;--bad:#a8341f;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);display:grid;place-items:center;padding:20px;color:var(--ink)}
main{width:min(560px,100%);background:var(--panel);border-radius:22px;padding:28px 26px 24px}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
p.sub{margin:0 0 22px;color:var(--mute)}
label{font-weight:600;font-size:.9rem}
input{width:100%;margin:6px 0 14px;padding:14px;font:inherit;border:2px solid var(--line);border-radius:12px;background:#fffaf0;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
button{width:100%;padding:14px;font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--ink);color:var(--panel);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.reels{display:none;justify-content:center;gap:18px;margin:18px 0 0}
.busy .reels{display:flex}
.reel{width:34px;height:34px;border-radius:50%;border:6px solid var(--ink);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reel{animation:none}}
#status{min-height:1.4em;margin:14px 0 0;font-size:.95rem}
#status.err{color:var(--bad);font-weight:600}
ul{list-style:none;margin:18px 0 0;padding:0;border-top:2px solid var(--line)}
li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
li a{color:var(--go);font-weight:600}
li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#install{margin-top:12px;background:transparent;color:var(--ink);border:2px solid var(--ink);display:none}
</style>
</head>
<body>
<main id="app">
  <h1>Grogu MP3</h1>
  <p class="sub">Paste a YouTube or YouTube Music link. The MP3 is made on this computer.</p>
  <label for="url">Video or song link</label>
  <input id="url" type="url" inputmode="url" placeholder="https://music.youtube.com/watch?v=..." autocomplete="off">
  <button id="go">Convert to MP3</button>
  <div class="reels" aria-hidden="true"><div class="reel"></div><div class="reel"></div></div>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="done"></ul>
  <button id="install">Install app</button>
</main>
<script>
const $ = id => document.getElementById(id);
const app = $("app"), url = $("url"), go = $("go"), status = $("status"), done = $("done");

async function convert() {
  const link = url.value.trim();
  if (!link) { status.className = "err"; status.textContent = "Paste a link first."; return; }
  go.disabled = true; app.classList.add("busy");
  status.className = ""; status.textContent = "Downloading and converting. This can take a minute.";
  try {
    const res = await fetch("/api/convert", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: link })
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Conversion failed.");
    const name = decodeURIComponent(res.headers.get("X-Filename") || "audio.mp3");
    const href = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement("a"), { href, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    const li = document.createElement("li");
    li.innerHTML = `<span></span><a download href="${href}">Save again</a>`;
    li.firstChild.textContent = name;
    done.prepend(li);
    status.textContent = "Done. Saved " + name; url.value = "";
  } catch (e) {
    status.className = "err"; status.textContent = e.message;
  } finally {
    go.disabled = false; app.classList.remove("busy");
  }
}
go.onclick = convert;
url.addEventListener("keydown", e => e.key === "Enter" && convert());

let prompt;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; $("install").style.display = "block"; });
$("install").onclick = () => prompt && prompt.prompt();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
